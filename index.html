<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="htmlTitle">WOTAKU PROFILE BOOK</title>
  <style>
    * { box-sizing: border-box; }
    html { margin: 0; padding: 0; background: #ffffff; }
    body {
      margin: 0; padding: 0; color: #222222; background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    button, input { font: inherit; }
    .site { width: min(1180px, 100%); margin: 0 auto; padding: 0 24px 80px; position: relative; }
    
    .admin-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 0 0;
      gap: 10px;
    }
    .admin-btn {
      background: #f4f4f4;
      border: 1px solid #cccccc;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #555555;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .admin-btn:hover { background: #e8e8e8; color: #111111; }
    .admin-badge {
      font-size: 12px;
      font-weight: 700;
      color: #2e7d32;
      background: #e8f5e9;
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid #c8e6c9;
    }

    /* 設定モーダル UI */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-overlay[hidden] {
      display: none !important;
    }
    .modal-card {
      background: #ffffff; width: min(440px, 90vw); padding: 28px; border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .setting-item { margin-bottom: 20px; }
    .setting-label { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 8px; display: block; }
    
    /* トグルスイッチ */
    .switch-label { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc; transition: .3s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(20px); }

    .date-input {
      width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .save-btn { background: #222; color: #fff; border: 0; padding: 8px 18px; border-radius: 8px; cursor: pointer; }
    .cancel-btn { background: #eee; color: #333; border: 0; padding: 8px 18px; border-radius: 8px; cursor: pointer; }

    .hero { padding: 30px 0 40px; text-align: center; }
    .eyebrow { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #999999; }
    .hero h1 { margin: 0; font-size: clamp(28px, 5vw, 52px); letter-spacing: 0.04em; }
    .hero-text { margin: 18px 0 0; color: #777777; font-size: 14px; }
    .section-title { margin: 20px 0 28px; }
    .section-title h2 { margin: 0; font-size: 28px; letter-spacing: 0.08em; }
    .search-area { margin: 0 0 30px; }
    .search-area input {
      width: 100%; max-width: 420px; height: 48px; padding: 0 18px;
      border: 1px solid #dddddd; border-radius: 24px; outline: none; background: #ffffff;
    }
    .search-area input:focus { border-color: #999999; }
    .profile-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 20px; }
    .profile-card { display: block; overflow: hidden; color: inherit; text-decoration: none; background: #ffffff; cursor: pointer; }
    .profile-image-wrap { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #f3f3f3; }
    .profile-image { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
    .profile-card:hover .profile-image { transform: scale(1.04); }
    .profile-info { padding: 14px 2px 8px; }
    .profile-name { margin: 0; font-size: 18px; font-weight: 700; }
    .profile-message { margin: 7px 0 0; color: #777777; font-size: 13px; line-height: 1.6; }
    .loading, .empty, .error { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: #888888; }
    .back-button { margin: 30px 0 28px; padding: 10px 0; border: 0; background: transparent; color: #555555; cursor: pointer; font-size: 13px; letter-spacing: 0.08em; }
    .detail-page { max-width: 820px; margin: 0 auto; }
    .detail-hero { text-align: center; padding: 10px 0 50px; }
    .detail-profile-image { width: min(280px, 70vw); aspect-ratio: 1 / 1; object-fit: cover; border-radius: 50%; display: block; margin: 0 auto 28px; background: #f3f3f3; }
    .detail-name { margin: 0; font-size: clamp(28px, 6vw, 44px); }
    .detail-section { padding: 30px 0; border-top: 1px solid #eeeeee; }
    .detail-section h3 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.1em; color: #999999; }
    .detail-text { margin: 0; white-space: pre-wrap; line-height: 1.9; font-size: 15px; }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table tr { border-bottom: 1px solid #eeeeee; }
    .info-table th, .info-table td { padding: 15px 0; text-align: left; vertical-align: top; }
    .info-table th { width: 35%; color: #888888; font-size: 13px; font-weight: 600; }
    .info-table td { font-size: 15px; }
    .x-link { color: inherit; }
    .detail-image { display: block; width: 100%; height: auto; margin: 18px 0 0; border-radius: 8px; background: #f3f3f3; }
    .image-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .image-grid .detail-image { margin: 0; }
    @media (max-width: 900px) { .profile-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      .site { padding-left: 16px; padding-right: 16px; }
      .hero { padding-top: 20px; padding-bottom: 28px; }
      .profile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; }
      .profile-name { font-size: 15px; }
      .profile-message { font-size: 12px; }
      .detail-profile-image { width: min(220px, 65vw); }
      .image-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <main class="site">
    <div class="admin-bar">
      <span id="adminBadge" class="admin-badge" hidden></span>
      <button id="adminBtn" class="admin-btn" type="button"></button>
      <button id="settingsBtn" class="admin-btn" type="button" hidden></button>
    </div>

    <header class="hero">
      <p class="eyebrow">PROFILE BOOK</p>
      <h1 id="heroTitle"></h1>
      <p id="heroText" class="hero-text"></p>
    </header>

    <section id="listPage">
      <div class="section-title">
        <p class="eyebrow">MEMBERS</p>
        <h2>PROFILE</h2>
      </div>

      <div class="search-area">
        <input id="searchInput" type="search" placeholder="" autocomplete="off">
      </div>

      <div id="profileGrid" class="profile-grid"></div>
    </section>

    <section id="detailPage" class="detail-page" hidden>
      <button id="backButton" class="back-button" type="button"></button>
      <div id="detailContent"></div>
    </section>
  </main>

  <!-- 管理設定モーダル -->
  <div id="settingsModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div id="modalHeader" class="modal-header"></div>
      
      <div class="setting-item">
        <span id="modalToggleLabel" class="setting-label"></span>
        <label class="switch-label">
          <span class="switch">
            <input type="checkbox" id="publicToggle" onchange="toggleDateInputs()">
            <span class="slider"></span>
          </span>
          <span id="toggleStatusText"></span>
        </label>
      </div>

      <div id="dateArea" style="display:none;">
        <div class="setting-item">
          <label id="modalStartLabel" class="setting-label" for="startDateInput"></label>
          <input type="datetime-local" id="startDateInput" class="date-input">
        </div>

        <div class="setting-item">
          <label id="modalEndLabel" class="setting-label" for="endDateInput"></label>
          <input type="datetime-local" id="endDateInput" class="date-input">
        </div>
      </div>

      <div class="modal-actions">
        <button id="modalCancelBtn" class="cancel-btn" type="button" onclick="closeSettingsModal()"></button>
        <button id="modalSaveBtn" class="save-btn" type="button" onclick="saveSettings()"></button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
     * ⚙️ 設定項目（文言・URL・メッセージの一括変更）
     * ========================================================= */
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycbya94n7ABGUf2ddHFFkLSi4ZKUjR5eZz2ZWa6NnCLK7b2fBl7RhfkVud6BIMgK9LlwyAA/exec',

      LABELS: {
        siteTitle: '空野青空生誕2026 WOTAKU PROFILE BOOK',
        siteSubtitle: 'あおにゃんを応援するみんなのプロフィール',
        
        adminBtnInactive: '🔒 蒼い彗星専用コンソール',
        adminBtnActive: 'ミノフスキー粒子・散布（一般公開モード）',
        adminBadge: '✨ ミノフスキー粒子・解除中（全件表示中）',
        settingsBtn: '⚙️ 公開設定',
        
        searchPlaceholder: '名前で検索',
        backToList: '← PROFILE LIST',
        
        modalHeader: '⚙️ 一般公開設定',
        modalToggleLabel: '一般公開の有効化',
        modalStatusOn: 'ON（期間指定で公開）',
        modalStatusOff: 'OFF（手動非公開中）',
        modalStartLabel: '公開開始日時',
        modalEndLabel: '公開終了日時',
        modalSaveBtn: '保存する',
        modalCancelBtn: 'キャンセル',

        xAccount: 'Xアカウント',
        profileNumber: 'プロフィール番号',
        birthplace: '出身地・国',
        birthday: '誕生日',
        favoriteSong: 'FAVORITE SONG',
        favoritePoint: 'WHAT I LOVE',
        message: 'MESSAGE',
        messageCard: 'MESSAGE CARD',
        aonyacchi: 'AONYACCHI',
        otherPhotos: 'OTHER PHOTOS',
        unSet: '未設定',
        anonymous: '名無し'
      },

      MESSAGES: {
        loading: '読み込み中...',
        outOfPeriod: '現在は公開期間外です。',
        emptyProfiles: '公開プロフィールはありません。',
        promptPassword: 'パスワードを入力してください（蒼い彗星専用）:',
        emptyPasswordAlert: 'パスワードを入力してください。',
        wrongPasswordAlert: 'パスワードが違います。',
        notFoundProfileAlert: 'プロフィールが見つかりませんでした。',
        saveSuccessAlert: '設定を保存しました。',
        saveFailedAlert: '保存に失敗しました。',
        networkErrorAlert: '通信エラーが発生しました。',
        fetchErrorPrefix: 'データの取得に失敗しました (HTTP '
      }
    };

    /* =========================================================
     * メイン処理
     * ========================================================= */
    let allProfiles = [];
    let currentSettings = { enabled: false, start: '', end: '' };

    document.addEventListener('DOMContentLoaded', function() {
      initUI();
      
      document.getElementById('searchInput').addEventListener('input', filterProfiles);
      document.getElementById('backButton').addEventListener('click', showList);
      document.getElementById('adminBtn').addEventListener('click', handleAdminToggle);
      document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
      
      updateAdminUI();
      loadPage();
    });

    function initUI() {
      document.getElementById('htmlTitle').textContent = CONFIG.LABELS.siteTitle;
      document.getElementById('heroTitle').innerHTML = CONFIG.LABELS.siteTitle.replace('WOTAKU', '<br>WOTAKU');
      document.getElementById('heroText').textContent = CONFIG.LABELS.siteSubtitle;
      
      document.getElementById('adminBadge').textContent = CONFIG.LABELS.adminBadge;
      document.getElementById('settingsBtn').textContent = CONFIG.LABELS.settingsBtn;
      document.getElementById('searchInput').placeholder = CONFIG.LABELS.searchPlaceholder;
      document.getElementById('backButton').textContent = CONFIG.LABELS.backToList;

      document.getElementById('modalHeader').textContent = CONFIG.LABELS.modalHeader;
      document.getElementById('modalToggleLabel').textContent = CONFIG.LABELS.modalToggleLabel;
      document.getElementById('modalStartLabel').textContent = CONFIG.LABELS.modalStartLabel;
      document.getElementById('modalEndLabel').textContent = CONFIG.LABELS.modalEndLabel;
      document.getElementById('modalSaveBtn').textContent = CONFIG.LABELS.modalSaveBtn;
      document.getElementById('modalCancelBtn').textContent = CONFIG.LABELS.modalCancelBtn;
    }

    function loadPage() {
      showList();
    }

    function updateAdminUI() {
      const pass = sessionStorage.getItem('admin_pass');
      if (pass) {
        document.getElementById('adminBadge').hidden = false;
        document.getElementById('settingsBtn').hidden = false;
        document.getElementById('adminBtn').textContent = CONFIG.LABELS.adminBtnActive;
      } else {
        document.getElementById('adminBadge').hidden = true;
        document.getElementById('settingsBtn').hidden = true;
        document.getElementById('adminBtn').textContent = CONFIG.LABELS.adminBtnInactive;
      }
    }

    function handleAdminToggle() {
      const currentPass = sessionStorage.getItem('admin_pass');
      
      if (currentPass) {
        sessionStorage.removeItem('admin_pass');
        allProfiles = [];
        updateAdminUI();
        fetchDataAndRender();
        return;
      }

      const inputPass = prompt(CONFIG.MESSAGES.promptPassword);
      if (inputPass === null) return;
      if (!inputPass.trim()) {
        alert(CONFIG.MESSAGES.emptyPasswordAlert);
        return;
      }

      sessionStorage.setItem('admin_pass', inputPass.trim());
      allProfiles = [];
      updateAdminUI();
      fetchDataAndRender();
    }

    function openSettingsModal() {
      document.getElementById('publicToggle').checked = currentSettings.enabled;
      document.getElementById('startDateInput').value = currentSettings.start || '';
      document.getElementById('endDateInput').value = currentSettings.end || '';
      toggleDateInputs();
      document.getElementById('settingsModal').hidden = false;
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').hidden = true;
    }

    function toggleDateInputs() {
      const isChecked = document.getElementById('publicToggle').checked;
      document.getElementById('toggleStatusText').textContent = isChecked ? CONFIG.LABELS.modalStatusOn : CONFIG.LABELS.modalStatusOff;
      document.getElementById('dateArea').style.display = isChecked ? 'block' : 'none';
    }

    function saveSettings() {
      const pass = sessionStorage.getItem('admin_pass') || '';
      const enabled = document.getElementById('publicToggle').checked;
      const start = document.getElementById('startDateInput').value;
      const end = document.getElementById('endDateInput').value;

      const payload = {
        action: 'saveSettings',
        pass: pass,
        enabled: enabled,
        start: start,
        end: end
      };

      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            alert(CONFIG.MESSAGES.saveSuccessAlert);
            closeSettingsModal();
            fetchDataAndRender();
          } else {
            console.error('Save failed response:', data);
            alert(CONFIG.MESSAGES.saveFailedAlert);
          }
        })
        .catch(err => {
          console.error('Network or Parse Error:', err);
          alert(CONFIG.MESSAGES.networkErrorAlert);
        });
    }

    function showList() {
      document.getElementById('listPage').hidden = false;
      document.getElementById('detailPage').hidden = true;

      if (allProfiles.length > 0) {
        renderProfiles(allProfiles, true, true);
        return;
      }

      fetchDataAndRender();
    }

    function fetchDataAndRender() {
      const grid = document.getElementById('profileGrid');
      grid.innerHTML = '<div class="loading">' + escapeHtml(CONFIG.MESSAGES.loading) + '</div>';

      const pass = sessionStorage.getItem('admin_pass') || '';
      const fetchUrl = CONFIG.GAS_URL + '?pass=' + encodeURIComponent(pass) + '&t=' + Date.now();

      fetch(fetchUrl)
        .then(function(response) {
          if (!response.ok) {
            throw new Error(CONFIG.MESSAGES.fetchErrorPrefix + response.status + ')');
          }
          return response.json();
        })
        .then(function(data) {
          if (Array.isArray(data)) {
            allProfiles = data;
            renderProfiles(allProfiles, true, false);
          } else {
            allProfiles = data.profiles || [];
            currentSettings = data.settings || { enabled: false, start: '', end: '' };
            
            if (pass && !data.isAuth) {
              alert(CONFIG.MESSAGES.wrongPasswordAlert);
              sessionStorage.removeItem('admin_pass');
              updateAdminUI();
            }

            renderProfiles(allProfiles, data.isPublicOpen, data.isAuth);
          }
        })
        .catch(function(error) {
          grid.innerHTML = '<div class="error">' + escapeHtml(error.message) + '</div>';
        });
    }

    function renderProfiles(profiles, isPublicOpen, isAuth) {
      const grid = document.getElementById('profileGrid');

      if (!isAuth && isPublicOpen === false) {
        grid.innerHTML = '<div class="empty">' + escapeHtml(CONFIG.MESSAGES.outOfPeriod) + '</div>';
        return;
      }

      if (!profiles.length) {
        grid.innerHTML = '<div class="empty">' + escapeHtml(CONFIG.MESSAGES.emptyProfiles) + '</div>';
        return;
      }

      grid.innerHTML = profiles.map(createCard).join('');
    }

    function createCard(profile) {
      const name = safeStr(profile.name);
      const img = safeStr(profile.profileImage);
      const msg = safeStr(profile.birthdayMessage);
      const id = safeStr(profile.id);

      return `
        <div class="profile-card" onclick="selectProfile('${escapeAttribute(id)}')">
          <div class="profile-image-wrap">
            <img class="profile-image" src="${escapeAttribute(img)}" alt="${escapeHtml(name)}" loading="lazy">
          </div>
          <div class="profile-info">
            <h3 class="profile-name">${escapeHtml(name || CONFIG.LABELS.anonymous)}</h3>
            ${msg ? `<p class="profile-message">${escapeHtml(msg)}</p>` : ''}
          </div>
        </div>
      `;
    }

    function filterProfiles(event) {
      const keyword = event.target.value.trim().toLowerCase();

      if (!keyword) {
        renderProfiles(allProfiles, true, true);
        return;
      }

      const filtered = allProfiles.filter(function(profile) {
        return safeStr(profile.name).toLowerCase().includes(keyword);
      });

      renderProfiles(filtered, true, true);
    }

    function selectProfile(profileId) {
      const profile = allProfiles.find(function(p) {
        return safeStr(p.id) === profileId;
      });

      if (!profile) {
        alert(CONFIG.MESSAGES.notFoundProfileAlert);
        return;
      }

      document.getElementById('listPage').hidden = true;
      document.getElementById('detailPage').hidden = false;

      renderDetail(profile);
      window.scrollTo(0, 0);
    }

    function renderDetail(profile) {
      const name = safeStr(profile.name);
      const img = safeStr(profile.profileImage);
      const xInfo = formatXAccount(profile.x);
      const xHtml = xInfo
        ? `<a class="x-link" href="${escapeAttribute(xInfo.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(xInfo.display)}</a>`
        : escapeHtml(CONFIG.LABELS.unSet);

      const favSong = safeStr(profile.favoriteSong);
      const favPoint = safeStr(profile.favoritePoint);
      const msg = safeStr(profile.birthdayMessage);
      const meseca = safeStr(profile.meseca);
      const aonyacchi = safeStr(profile.aonyacchi);

      document.getElementById('detailContent').innerHTML = `
        <div class="detail-hero">
          <img class="detail-profile-image" src="${escapeAttribute(img)}" alt="${escapeHtml(name)}">
          <h1 class="detail-name">${escapeHtml(name)}</h1>
        </div>

        <section class="detail-section">
          <table class="info-table">
            <tr><th>${escapeHtml(CONFIG.LABELS.xAccount)}</th><td>${xHtml}</td></tr>
            <tr><th>${escapeHtml(CONFIG.LABELS.profileNumber)}</th><td>${escapeHtml(safeStr(profile.profileNumber))}</td></tr>
            <tr><th>${escapeHtml(CONFIG.LABELS.birthplace)}</th><td>${escapeHtml(safeStr(profile.birthplace))}</td></tr>
            <tr><th>${escapeHtml(CONFIG.LABELS.birthday)}</th><td>${escapeHtml(safeStr(profile.birthday))}</td></tr>
          </table>
        </section>

        ${favSong ? `<section class="detail-section"><h3>${escapeHtml(CONFIG.LABELS.favoriteSong)}</h3><p class="detail-text">${escapeHtml(favSong)}</p></section>` : ''}
        ${favPoint ? `<section class="detail-section"><h3>${escapeHtml(CONFIG.LABELS.favoritePoint)}</h3><p class="detail-text">${escapeHtml(favPoint)}</p></section>` : ''}
        ${msg ? `<section class="detail-section"><h3>${escapeHtml(CONFIG.LABELS.message)}</h3><p class="detail-text">${escapeHtml(msg)}</p></section>` : ''}
        ${meseca ? `<section class="detail-section"><h3>${escapeHtml(CONFIG.LABELS.messageCard)}</h3><img class="detail-image" src="${escapeAttribute(meseca)}" alt="メセカ画像"></section>` : ''}
        ${aonyacchi ? `<section class="detail-section"><h3>${escapeHtml(CONFIG.LABELS.aonyacchi)}</h3><img class="detail-image" src="${escapeAttribute(aonyacchi)}" alt="あおにゃっち画像"></section>` : ''}
        ${createOtherImages(profile)}
      `;
    }

    function createOtherImages(profile) {
      const images = [safeStr(profile.other1), safeStr(profile.other2), safeStr(profile.other3)].filter(Boolean);
      if (!images.length) return '';

      return `
        <section class="detail-section">
          <h3>${escapeHtml(CONFIG.LABELS.otherPhotos)}</h3>
          <div class="image-grid">
            ${images.map(function(image, index) {
              return `<img class="detail-image" src="${escapeAttribute(image)}" alt="その他画像${index + 1}">`;
            }).join('')}
          </div>
        </section>
      `;
    }

    function safeStr(val) {
      if (val === undefined || val === null || val === 'undefined' || val === 'null') return '';
      return String(val).trim();
    }

    function escapeHtml(value) {
      const str = safeStr(value);
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function formatXAccount(xValue) {
      const raw = safeStr(xValue);
      if (!raw) return null;

      let url = raw;
      let display = raw;

      if (!/^https?:\/\//i.test(raw)) {
        const handle = raw.replace(/^@/, '');
        url = 'https://x.com/' + handle;
        display = '@' + handle;
      } else {
        const match = raw.match(/(?:x|twitter)\.com\/([a-zA-Z0-9_]+)/i);
        if (match && match[1]) {
          display = '@' + match[1];
        }
      }

      return { url: url, display: display };
    }
  </script>
</body>
</html>
