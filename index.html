<div id="gas-data">読み込み中...</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/XXX/exec'; // WebアプリURL

  fetch(GAS_URL)
    .then(response => response.json())
    .then(data => {
      document.getElementById('gas-data').innerHTML = `
        <h2>${data.title}</h2>
        <p>${data.content}</p>
      `;
    })
    .catch(error => {
      document.getElementById('gas-data').innerText = 'データの取得に失敗しました。';
    });
</script>
