<div id="gas-data">読み込み中...</div>

<script>
  // ここを最新のデプロイURL（/exec）に置き換えてください
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbya94n7ABGUf2ddHFFkLSi4ZKUjR5eZz2ZWa6NnCLK7b2fBl7RhfkVud6BIMgK9LlwyAA/exec';

  fetch(GAS_URL)
    .then(response => {
      if (!response.ok) {
        throw new Error('HTTPエラー: ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      document.getElementById('gas-data').innerHTML = `
        <h2>${data.title}</h2>
        <p>${data.content}</p>
      `;
    })
    .catch(error => {
      // コンソールに詳しいエラー内容を出力
      console.error('取得失敗の理由:', error);
      document.getElementById('gas-data').innerText = 'データの取得に失敗しました。';
    });
</script>
